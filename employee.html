<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="D.Pawson Time"><title>D.Pawson Time Recording</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><h1>D.Pawson & Sons — Employee</h1><span id="empName"></span></header><main class="container"><section id="pairCard" class="card narrow" style="margin:30px auto"><h2>Pair this phone</h2><p class="muted">Enter the 6-digit code provided by the manager.</p><label>Pairing code</label><input id="pairCode" inputmode="numeric" maxlength="6"><label>Phone name (optional)</label><input id="deviceName"><div id="pairMsg"></div><button class="btn" id="pairBtn">Pair phone</button></section><section id="appCard" style="display:none"><div class="card"><div class="muted">Current status</div><div class="status" id="status">—</div><div class="actions"><button class="btn success" id="clockIn">CLOCK IN</button><button class="btn danger" id="clockOut">CLOCK OUT</button><button class="btn secondary" id="breakStart">START BREAK</button><button class="btn secondary" id="breakEnd">END BREAK</button></div><div id="eventMsg"></div></div><div class="card"><h2>Add overtime</h2><div class="grid two"><div><label>Date</label><input type="date" id="otDate"></div><div><label>Reason</label><input id="otReason"></div><div><label>Start time</label><input type="time" id="otStart"></div><div><label>Finish time</label><input type="time" id="otFinish"></div></div><div class="actions"><button class="btn" id="otSubmit">Submit for approval</button><span class="muted" id="pendingCount"></span></div><div id="otMsg"></div></div><div class="card"><h2>Today's record</h2><div id="today"></div></div></section></main><script src="/employee.js"></script></body></html>
